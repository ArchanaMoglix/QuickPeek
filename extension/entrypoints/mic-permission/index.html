<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Peek – Microphone</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0d14;
        color: #e8eaf2;
      }
      .card {
        max-width: 380px;
        padding: 32px;
        text-align: center;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      h1 { font-size: 20px; margin: 0 0 10px; }
      p { color: #a3a7bb; line-height: 1.6; margin: 0 0 20px; }
      button {
        padding: 11px 20px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #8175ff, #5c4de8);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #status { margin: 16px 0 0; font-size: 14px; }
      #test { margin-top: 18px; text-align: left; }
      #device { font-size: 13px; color: #a3a7bb; margin: 0 0 8px; }
      .meter { height: 10px; border-radius: 6px; background: #171925; overflow: hidden; }
      #level { height: 100%; width: 0; background: linear-gradient(90deg, #4cc38a, #8175ff); transition: width 0.08s; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>🎤 Allow microphone</h1>
      <p>Quick Peek needs microphone access so you can ask questions by voice.</p>
      <button id="allow">Allow microphone</button>
      <p id="status"></p>
      <div id="test" hidden>
        <p id="device"></p>
        <div class="meter"><div id="level"></div></div>
        <p id="hint" style="font-size:13px;margin:10px 0 0">Say something. The bar should move.</p>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
